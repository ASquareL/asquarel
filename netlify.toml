# ============================================================
# A Square L Innovate — Netlify Configuration
# ============================================================

[build]
  # Serve the public-site as the default landing
  publish = "apps/public-site"
  # No build command — this is a static site

# ============================================================
# REDIRECTS — map incoming URLs to the right files
# ============================================================

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Academy app lives at /academy/*
[[redirects]]
  from = "/academy"
  to = "/../academy/index.html"
  status = 200

[[redirects]]
  from = "/academy/*"
  to = "/../academy/:splat"
  status = 200

# ASLDS design system showcase at /aslds/*
[[redirects]]
  from = "/aslds"
  to = "/../../packages/aslds/showcase/index.html"
  status = 200

[[redirects]]
  from = "/aslds/*"
  to = "/../../packages/aslds/showcase/:splat"
  status = 200

# ============================================================
# HEADERS — security defaults
# ============================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"