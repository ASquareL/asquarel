<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Feedback — ASL Admin" />
    <meta name="author" content="A Square L Innovate" />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="noindex" />
    <title>Feedback — ASL Admin</title>

    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="assets/images/favicon.png" />

    <link rel="stylesheet" href="../../packages/aslds/css/reset.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/variables.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/typography.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/layout.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/utilities.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/animations.css" />

    <link rel="stylesheet" href="../../packages/aslds/css/components/sidebar.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/buttons.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/cards.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/forms.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/dashboard.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/badge.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/avatar.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/toast.css" />

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="dashboard-layout">

        <aside class="sidebar" id="dashboard-sidebar" aria-label="Admin Navigation">

            <div class="sidebar-header">
                <a href="index.html" class="sidebar-logo">
                    <div class="sidebar-brand">
                        <span class="sidebar-title">ASL</span>
                        <span class="sidebar-subtitle">Admin</span>
                    </div>
                </a>
            </div>

            <div class="sidebar-user">
                <div class="avatar avatar-xl avatar-gold mb-3">
                    <span class="avatar-initials" data-user-initials>??</span>
                </div>
                <div class="sidebar-name" data-user-name>Loading…</div>
                <div class="sidebar-role" data-user-role>admin</div>
            </div>

            <nav class="sidebar-nav" aria-label="Admin Menu">
                <ul class="sidebar-menu">
                    <li class="sidebar-item">
                        <a href="index.html" class="sidebar-link">
                            <i class="fa-solid fa-gauge-high"></i> Dashboard
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="lessons.html" class="sidebar-link">
                            <i class="fa-solid fa-book-open"></i> Lessons
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="feedback.html" class="sidebar-link active" aria-current="page">
                            <i class="fa-solid fa-comment-dots"></i> Feedback
                            <span class="badge badge-sm badge-danger sidebar-link-badge" data-feedback-count hidden>0</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="../academy/dashboard.html" class="sidebar-link">
                            <i class="fa-solid fa-eye"></i> View Academy
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <a href="#" class="sidebar-link" data-signout>
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            </div>

        </aside>

        <main id="main-content" class="dashboard-content">

            <div class="d-flex justify-between align-center flex-wrap gap-3 mb-5">

                <div class="d-flex align-center gap-3">
                    <button class="mobile-toggle" type="button" aria-label="Toggle Sidebar" aria-expanded="false" aria-controls="dashboard-sidebar">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>

                    <div>
                        <h1 class="mb-1">Feedback</h1>
                        <p class="mb-0" data-feedback-count-text>Loading…</p>
                    </div>
                </div>

                <button class="btn btn-outline btn-sm" type="button" data-theme-toggle aria-label="Toggle Theme">
                    Theme
                </button>

            </div>

            <!-- Filters -->
            <div class="feedback-filters">
                <span class="feedback-filters-label">Category:</span>

                <button type="button" class="feedback-filter-chip is-active" data-filter-category="all">All</button>
                <button type="button" class="feedback-filter-chip" data-filter-category="bug">Bugs</button>
                <button type="button" class="feedback-filter-chip" data-filter-category="confusion">Confusing</button>
                <button type="button" class="feedback-filter-chip" data-filter-category="suggestion">Suggestions</button>
                <button type="button" class="feedback-filter-chip" data-filter-category="praise">Praise</button>
                <button type="button" class="feedback-filter-chip" data-filter-category="other">Other</button>

                <div class="feedback-filters-divider" aria-hidden="true"></div>

                <button type="button" class="feedback-filter-chip" data-filter-unresolved>
                    <i class="fa-solid fa-filter"></i> Unresolved only
                </button>
            </div>

            <!-- List -->
            <div data-feedback-list>
                <p class="is-empty">Loading…</p>
            </div>

            <div data-feedback-empty hidden>
                <div class="card">
                    <div class="card-body text-center py-5">
                        <div class="avatar avatar-lg avatar-gold mb-4 mx-auto">
                            <i class="fa-solid fa-inbox fa-2x text-gold"></i>
                        </div>
                        <h3 class="mb-2">No feedback yet</h3>
                        <p class="mb-0">When users send feedback, it will appear here.</p>
                    </div>
                </div>
            </div>

        </main>

    </div>

    <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <section id="toast-region" aria-live="polite" aria-label="Toast Notifications"></section>
    <dialog id="modal-root" aria-label="Application Modal"></dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../packages/shared/js/core/supabase-config.js"></script>

    <script src="../../packages/aslds/js/app.js"></script>
    <script src="../../packages/aslds/js/sidebar.js"></script>
    <script src="../../packages/aslds/js/modal.js"></script>
    <script src="../../packages/aslds/js/theme.js"></script>
    <script src="../../packages/aslds/js/animations.js"></script>
    <script src="../../packages/aslds/js/toast.js"></script>

    <script src="../../packages/shared/js/admin/admin.js"></script>
    <script src="../../packages/shared/js/admin/admin-feedback.js"></script>

</body>
</html>
