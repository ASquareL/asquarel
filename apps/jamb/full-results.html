<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mock Exam Results — A Square L JAMB</title>
    <link rel="icon" type="image/png" href="../academy/assets/images/favicon.png" />
    <link rel="stylesheet" href="../../packages/aslds/css/reset.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/variables.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/typography.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/layout.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/utilities.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/animations.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/buttons.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/cards.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/badge.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/progress.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/lesson-content.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-glow-top">
    <main id="main-content" class="main-content">
        <div class="container section max-content">
            
            <div class="text-center mb-5">
                <span class="badge badge-success mb-3">Exam Completed</span>
                <h1 class="mb-3">Full Mock Results</h1>
                <p class="text-muted">Here is your aggregate UTME score.</p>
            </div>

            <!-- AGGREGATE SCORE HERO -->
            <div class="card bg-sheen-gold mb-5">
                <div class="card-body text-center py-5">
                    <div class="text-muted text-uppercase font-bold tracking-wider mb-2" style="letter-spacing: 2px;">Total Aggregate Score</div>
                    <div class="quiz-result-score text-white" style="font-size: 96px; line-height: 1;" data-total-score>0</div>
                    <div class="text-muted mt-2" style="font-size: var(--fs-xl);">out of 400</div>
                </div>
            </div>

            <!-- SUBJECT BREAKDOWN -->
            <h2 class="mb-4">Subject Breakdown</h2>
            <div class="d-flex flex-column gap-3 mb-5" data-subject-breakdown>
                <div class="text-center py-5">
                    <i class="fa-solid fa-spinner fa-spin fa-2x text-gold"></i>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="d-flex justify-between align-center flex-wrap gap-3 mb-5 pb-4 border-bottom">
                <a href="index.html" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
                <button class="btn btn-primary" type="button" data-toggle-review>
                    <i class="fa-solid fa-search"></i> Review Corrections
                </button>
            </div>

            <!-- DETAILED REVIEW (Hidden by default) -->
            <div data-review-section hidden>
                <h2 class="mb-4">Correction Review</h2>
                <div class="d-flex flex-column gap-4" data-review-list>
                    <!-- Questions injected here -->
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../packages/shared/js/core/supabase-config.js"></script>
    <script src="../../packages/aslds/js/app.js"></script>
    <script src="../../packages/aslds/js/theme.js"></script>
    <script src="../../packages/aslds/js/toast.js"></script>
    <script src="../../packages/shared/js/pages/jamb-full-results.js"></script>
</body>
</html>
