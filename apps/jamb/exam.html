<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CBT Exam — A Square L Academy</title>

    <link rel="icon" type="image/png" href="../academy/assets/images/favicon.png" />

    <link rel="stylesheet" href="../../packages/aslds/css/reset.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/variables.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/typography.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/layout.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/utilities.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/animations.css" />

    <link rel="stylesheet" href="../../packages/aslds/css/components/buttons.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/cards.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/badge.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/toast.css" />
    <link rel="stylesheet" href="../../packages/aslds/css/components/lesson-content.css" />

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-card">

    <main id="main-content" class="cbt-layout">

        <div class="d-flex flex-column">
            <div class="cbt-header">
                <div>
                    <h1 class="mb-1" data-exam-title>Loading Exam...</h1>
                    <p class="mb-0 text-muted" data-candidate-name>Candidate</p>
                </div>
                <div class="cbt-timer" data-timer>
                    <i class="fa-solid fa-clock"></i>
                    <span>00:00</span>
                </div>
                <div class="cbt-backdrop" data-sidebar-backdrop></div>
            </div>

            <div class="cbt-question-area" data-question-area>
                <div class="text-center py-5">
                    <i class="fa-solid fa-spinner fa-spin fa-3x text-gold"></i>
                </div>
            </div>
        </div>

        <div class="cbt-sidebar">
            <div>
                <h3 class="mb-3">Questions</h3>
                <div class="cbt-legend">
                    <div class="cbt-legend-item"><div class="cbt-legend-dot gold"></div> Answered</div>
                    <div class="cbt-legend-item"><div class="cbt-legend-dot"></div> Unanswered</div>
                </div>
                <div class="cbt-grid" data-question-grid></div>
            </div>
            <div class="dropdown-divider"></div>
            <button class="btn btn-success btn-block" type="button" data-submit-exam>
                <i class="fa-solid fa-paper-plane"></i> Submit Exam
            </button>
        </div>

    </main>

    <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <section id="toast-region" aria-live="polite" aria-label="Toast Notifications"></section>
    <dialog id="modal-root" aria-label="Application Modal"></dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../packages/shared/js/core/supabase-config.js"></script>
    <script src="../../packages/aslds/js/app.js"></script>
    <script src="../../packages/aslds/js/theme.js"></script>
    <script src="../../packages/aslds/js/toast.js"></script>
    <script src="../../packages/shared/js/pages/jamb-exam.js"></script>
</body>
</html>
