<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lesson — A Square L Academy" />
    <meta name="author" content="A Square L Innovate" />
    <meta name="theme-color" content="#050505" />
    <title>Lesson — A Square L Academy</title>

    <link rel="icon" type="image/png" href="../../assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="../../assets/images/favicon.png" />

    <!-- Core CSS -->
    <link rel="stylesheet" href="../../../../packages/aslds/css/reset.css" />
    <link rel="stylesheet" href="../../../../packages/aslds/css/variables.css" />
    <link rel="stylesheet" href="../../../../packages/aslds/css/typography.css" />
    <link rel="stylesheet" href="../../../../packages/aslds/css/layout.css" />
    <link rel="stylesheet" href="../../../../packages/aslds/css/utilities.css" />
    <link rel="stylesheet" href="../../../../packages/aslds/css/animations.css" />

    <!-- Component CSS -->
    <link rel="stylesheet" href="../../../../packages/aslds/css/components/buttons.css" />
    <link rel="stylesheet" href="../../../../packages/aslds/css/components/cards.css" />
    <link rel="stylesheet" href="../../../../packages/aslds/css/components/sidebar.css" />
    <link rel="stylesheet" href="../../../../packages/aslds/css/components/badge.css" />
    <link rel="stylesheet" href="../../../../packages/aslds/css/components/avatar.css" />
    <link rel="stylesheet" href="../../../../packages/aslds/css/components/progress.css" />
    <link rel="stylesheet" href="../../../../packages/aslds/css/components/toast.css" />
    <link rel="stylesheet" href="../../../../packages/aslds/css/components/alert.css" />

    <!-- Page-local video CSS — TO MOVE TO ASLDS when a second page needs it -->
    <style>
        .video-embed {
            aspect-ratio: 16 / 9;
            width: 100%;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border-color);
            margin-bottom: var(--space-4);
        }
        .video-embed iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        .video-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray-400);
        }
    </style>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <main id="main-content" class="main-content">

        <div class="course-layout" data-course="web-development">

            <!-- ============================================ -->
            <!-- LESSON SIDEBAR                               -->
            <!-- ============================================ -->
            <aside class="lesson-sidebar" aria-label="Course Navigation">

                <div class="p-4" style="border-bottom: 1px solid var(--border-color);">
                    <a href="../index.html" class="d-flex align-center gap-2 mb-3">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Back to course</span>
                    </a>
                    <strong data-course-title>Loading…</strong>
                </div>

                <div class="p-4" style="border-bottom: 1px solid var(--border-color);">
                    <div class="d-flex justify-between align-center mb-2">
                        <span class="text-muted">Your progress</span>
                        <span class="text-gold fw-bold" data-progress-percent>0%</span>
                    </div>
                    <div class="progress-bar mb-2">
                        <div class="progress-fill" style="width: 0%" data-progress-fill></div>
                    </div>
                    <small class="text-muted" data-progress-text>0 of 0 complete</small>
                </div>

                <nav class="p-4" aria-label="Lesson List" data-lesson-list>
                    <p class="text-muted">Loading lessons…</p>
                </nav>

            </aside>

            <!-- ============================================ -->
            <!-- LESSON CONTENT                               -->
            <!-- ============================================ -->
            <article class="lesson-content" data-lesson-content>

                <div class="d-flex justify-between align-center flex-wrap gap-3 mb-4">

                    <div>
                        <div class="d-flex align-center gap-2 flex-wrap mb-2">
                            <span class="text-muted">Lesson <span data-lesson-number>--</span> of <span data-lesson-total>--</span></span>
                            <span class="text-muted">·</span>
                            <span class="text-muted"><i class="fa-solid fa-clock"></i> <span data-lesson-duration>--</span></span>
                            <span class="text-muted">·</span>
                            <span class="text-muted" data-lesson-module>—</span>
                        </div>
                        <span class="badge" data-lesson-status>Loading…</span>
                    </div>

                    <button
                        class="btn btn-outline btn-sm"
                        type="button"
                        data-theme-toggle
                        aria-label="Toggle Theme"
                    >
                        Theme
                    </button>

                </div>

                <div data-lesson-video></div>

                <h1 class="mt-4 mb-4" data-lesson-title>Loading…</h1>

                <div data-lesson-body class="mb-5"></div>

                <div data-lesson-resources-section hidden>
                    <h2 class="mb-3">Resources</h2>
                    <div class="d-flex flex-column gap-3 mb-5" data-lesson-resources></div>
                </div>

                <div class="d-flex justify-between align-center flex-wrap gap-3 pt-4" style="border-top: 1px solid var(--border-color);">

                    <a class="btn btn-outline" data-prev-btn href="#">
                        <i class="fa-solid fa-arrow-left"></i> Previous
                    </a>

                    <button class="btn btn-primary" data-complete-btn type="button">
                        <i class="fa-solid fa-check"></i> Mark as Complete
                    </button>

                    <a class="btn btn-primary" data-next-btn href="#">
                        Next <i class="fa-solid fa-arrow-right"></i>
                    </a>

                </div>

            </article>

        </div>

    </main>

    <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <section id="toast-region" aria-live="polite" aria-label="Toast Notifications"></section>
    <dialog id="modal-root" aria-label="Application Modal"></dialog>

    <!-- Supabase SDK + config FIRST -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../../packages/shared/js/supabase-config.js"></script>

    <!-- ASLDS runtime (minimal — no navbar/sidebar/dropdown/tabs/modal/search) -->
    <script src="../../../../packages/aslds/js/app.js"></script>
    <script src="../../../../packages/aslds/js/theme.js"></script>
    <script src="../../../../packages/aslds/js/animations.js"></script>
    <script src="../../../../packages/aslds/js/toast.js"></script>

    <!-- Lesson logic -->
    <script src="../../../../packages/shared/js/lesson.js"></script>

</body>
</html>
