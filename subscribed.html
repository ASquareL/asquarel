<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Successful | A Square L Innovate</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-black: #000000;
            --surface-dark: #151515;
            --primary-gold: #D4AF37;
            --text-main: #ffffff;
            --text-muted: #cccccc;
            --success-green: #00c853;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg-black); 
            color: var(--text-main); 
            font-family: 'Nunito', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            text-align: center;
        }

        /* Brand Header */
        .brand-header { margin-bottom: 40px; }
        .brand-header img { width: 80px; margin-bottom: 10px; }
        .brand-header h2 { color: var(--primary-gold); font-weight: 800; font-size: 1.2rem; }

        /* Success Card matching your screenshot */
        .success-card {
            background-color: var(--surface-dark);
            border: 1px solid rgba(212, 175, 55, 0.3); /* Subtle gold border */
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.05);
            border-radius: 12px;
            padding: 50px 40px;
            max-width: 500px;
            width: 90%;
        }

        /* Green Checkmark Box */
        .check-icon {
            background-color: var(--success-green);
            color: white;
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px; /* Square edges like your screenshot */
            margin-bottom: 30px;
        }

        /* Typography */
        .success-card h1 {
            color: var(--primary-gold);
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 20px;
        }
        .success-card p {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 1rem;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        /* Gold Button */
        .btn-home {
            background-color: var(--primary-gold);
            color: #000000;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-weight: 800;
            font-size: 1rem;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .btn-home:hover {
            background-color: #b8860b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <img src="logo.png" alt="A Square L Logo">
        <h2>A Square L Innovate</h2>
    </div>

    <div class="success-card">
        <div class="check-icon">
            <i class="fa-solid fa-check"></i>
        </div>
        
        <h1>Subscription Successful!</h1>
        
        <p>Thank you for subscribing. You will now receive enterprise updates, academy news, and technical insights directly to your inbox.</p>
        
        <a href="index.html" class="btn-home">Return to Homepage</a>
    </div>

</body>
</html>
